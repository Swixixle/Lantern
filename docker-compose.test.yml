version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: lantern-postgres-test
    environment:
      POSTGRES_DB: lantern_test
      POSTGRES_USER: lantern_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lantern_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data
